<mat-toolbar color="primary" class="app-toolbar">
  <a [routerLink]="user() ? '/remittances' : '/login'" class="brand">
    <mat-icon>payments</mat-icon>
    <span class="brand-text">RemittanceManager</span>
  </a>

  <span class="spacer"></span>

  <a mat-button routerLink="/track">
    <mat-icon>search</mat-icon>
    <span class="btn-label">Track</span>
  </a>

  @if (user(); as u) {
    <button mat-button [matMenuTriggerFor]="menu">
      <mat-icon>account_circle</mat-icon>
      <span class="user-name btn-label">{{ u.displayName }}</span>
    </button>
    <mat-menu #menu="matMenu">
      <div class="menu-email">{{ u.email }}</div>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  } @else {
    <a mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      <span class="btn-label">Sign in</span>
    </a>
    <a mat-button routerLink="/register">
      <mat-icon class="only-mobile">person_add</mat-icon>
      <span class="btn-label">Create account</span>
    </a>
  }
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>
